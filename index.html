<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS Photo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #2a2a2a;
      --gray: #888;
      --white: #ffffff;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      color: var(--black);
      background: var(--white);
      overflow-y: scroll;
    }

    .page {
      display: none;
      min-height: 100vh;
      animation: fadeIn 0.4s ease;
    }
    .page.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── WELCOME PAGE ── */
    #page-welcome {
      display: none;
      min-height: 100vh;
    }
    #page-welcome.active {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .welcome-left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem 2.5rem;
      position: relative;
    }

    .welcome-logo {
      position: absolute;
      top: 2rem;
      left: 2.5rem;
    }

    .welcome-content h1 {
      font-family: var(--font-serif);
      font-weight: 300;
      font-size: clamp(3rem, 5vw, 5rem);
      line-height: 1;
      margin-bottom: 1rem;
      color: var(--black);
      letter-spacing: 0.1em;
    }

    .welcome-content p {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.2rem;
      color: var(--gray);
      margin-bottom: 2rem;
      font-weight: 300;
      letter-spacing: 0.04em;
    }

    .btn-enter {
      display: inline-block;
      border: 1px solid var(--black);
      padding: 0.7rem 2rem;
      font-family: var(--font-sans);
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--black);
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      text-decoration: none;
    }
    .btn-enter:hover {
      background: var(--black);
      color: var(--white);
    }

    .welcome-right {
      position: relative;
      overflow: hidden;
    }
    .welcome-right img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      min-height: 100vh;
    }

    /* ── INNER PAGES ── */
    .inner-header {
      text-align: center;
      padding: 2rem 1rem 0;
    }

    .inner-logo {
      display: block;
      margin: 0 auto 1.4rem;
      cursor: pointer;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 2rem;
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    nav a {
      color: var(--gray);
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
      padding-bottom: 2px;
    }
    nav a:hover { color: var(--black); text-decoration: underline; text-underline-offset: 5px; }
    nav a.active {
      color: var(--black);
      font-weight: 700;
    }

    /* ── PORTFOLIO ── */
    .portfolio-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 2px;
      margin: 3rem auto 0;
      max-width: 1100px;
      padding: 0 1rem;
    }

    .portfolio-grid img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s;
      cursor: zoom-in;
    }
    .portfolio-grid img:hover { opacity: 0.88; }

    /* ── ABOUT ── */
    .about-inner {
      max-width: 900px;
      margin: 2.5rem auto 4rem;
      padding: 0 1rem;
    }

    .about-hero {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      margin-bottom: 2rem;
      filter: grayscale(100%);
    }

    .about-inner h2 {
      font-family: var(--font-serif);
      font-weight: 300;
      font-size: 2.5rem;
      letter-spacing: 0.15em;
      margin-bottom: 0.6rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid #e0e0e0;
    }

    .about-inner p {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--gray);
      font-weight: 300;
      letter-spacing: 0.12em;
      margin-top: 1rem;
    }

    /* ── CONTACT ── */
    .contact-inner {
      max-width: 900px;
      margin: 3rem auto 4rem;
      padding: 0 1rem;
    }

    .contact-inner h2 {
      font-family: var(--font-serif);
      font-weight: 300;
      font-size: 2.5rem;
      letter-spacing: 0.1em;
      margin-bottom: 1.2rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid #e0e0e0;
    }

    .contact-inner span {
      font-family: var(--font-sans);
      font-size: 0.85rem;
      color: var(--gray);
      font-weight: 300;
      letter-spacing: 0.08em;
    }

    /* ── LIGHTBOX ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }

    .lightbox img {
      max-width: 98vw;
      max-height: 98vh;
      object-fit: contain;
      cursor: default;
      animation: lbIn 0.25s ease;
    }
    @keyframes lbIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }

    .lightbox-close {
      position: absolute;
      top: 1.2rem;
      right: 1.5rem;
      color: white;
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
      opacity: 0.7;
      transition: opacity 0.2s;
      font-family: var(--font-sans);
      font-weight: 300;
    }
    .lightbox-close:hover { opacity: 1; }

    .lightbox-prev, .lightbox-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 2rem;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s;
      padding: 1rem;
      user-select: none;
      font-family: var(--font-sans);
      font-weight: 300;
    }
    .lightbox-prev { left: 1rem; }
    .lightbox-next { right: 1rem; }
    .lightbox-prev:hover, .lightbox-next:hover { opacity: 1; }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .portfolio-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 680px) {
      #page-welcome.active {
        grid-template-columns: 1fr;
        grid-template-rows: auto 110vw;
      }
      .welcome-right img { min-height: unset; }
      .portfolio-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- WELCOME PAGE -->
  <div id="page-welcome" class="page active">
    <div class="welcome-left">
      <img class="welcome-logo" src="pictures/monogram.jpg" alt="JS Photo" style="height:100px; width:auto;" />
      <div class="welcome-content">
        <h1>welcome</h1>
        <p>to nature</p>
        <a class="btn-enter" onclick="goTo('portfolio')">ENTER</a>
      </div>
    </div>
    <div class="welcome-right">
      <img src="pictures/taube.jpg" alt="Taube" />
    </div>
  </div>

  <!-- PORTFOLIO PAGE -->
  <div id="page-portfolio" class="page">
    <div class="inner-header">
      <img class="inner-logo" src="pictures/monogram.jpg" alt="JS Photo" onclick="goTo('welcome')" style="height:100px; width:auto;" />
      <nav>
        <a onclick="goTo('welcome')">WELCOME</a>
        <a onclick="goTo('portfolio')" class="active" id="nav-portfolio">PORTFOLIO</a>
        <a onclick="goTo('about')" id="nav-about">ABOUT</a>
        <a onclick="goTo('contact')" id="nav-contact">CONTACT</a>
      </nav>
    </div>
    <div class="portfolio-grid" id="portfolio-grid">
      <img src="pictures/chamois.jpg" alt="Chamois" />
      <img src="pictures/bauchlandung.jpg" alt="Bauchlandung" />
      <img src="pictures/wasserfall.jpg" alt="Wasserfall" />
      <img src="pictures/bachstelze.jpg" alt="Bachstelze" />
      <img src="pictures/chamois2.jpg" alt="Chamois 2" />
      <img src="pictures/enteSonnenuntergang.jpg" alt="Ente Sonnenuntergang" />
      <img src="pictures/fuchsPortrait.jpg" alt="Fuchs Portrait" />
      <img src="pictures/gelbmeise.jpg" alt="Gelbmeise" />
      <img src="pictures/graureiher.jpg" alt="Graureiher" />
      <img src="pictures/amsel.jpg" alt="Amsel" />
      <img src="pictures/schneeberge.jpg" alt="Schneeberge" />
      <img src="pictures/graureiherGras.jpg" alt="Graureiher im Gras" />
      <img src="pictures/kingfisher.jpg" alt="Kingfisher" />
      <img src="pictures/roterWald.jpg" alt="Roter Wald" />
      <img src="pictures/taubenhaucher.jpg" alt="Taubenhaucher" />
      <img src="pictures/reh.jpg" alt="Reh" />
      <img src="pictures/schwarzeEnten.jpg" alt="Schwarze Enten" />
      <img src="pictures/taube.jpg" alt="Taube" />
    </div>
  </div>

  <!-- ABOUT PAGE -->
  <div id="page-about" class="page">
    <div class="inner-header">
      <img class="inner-logo" src="pictures/monogram.jpg" alt="JS Photo" onclick="goTo('welcome')" style="height:100px; width:auto;" />
      <nav>
        <a onclick="goTo('welcome')">WELCOME</a>
        <a onclick="goTo('portfolio')">PORTFOLIO</a>
        <a onclick="goTo('about')" class="active">ABOUT</a>
        <a onclick="goTo('contact')">CONTACT</a>
      </nav>
    </div>
    <div class="about-inner">
      <img class="about-hero" src="pictures/aboutMe.jpg" alt="Joel Spori" />
      <h2>Joel Spori</h2>
      <p>Passionate about nature and its inhabitants.</p>
    </div>
  </div>

  <!-- CONTACT PAGE -->
  <div id="page-contact" class="page">
    <div class="inner-header">
      <img class="inner-logo" src="pictures/monogram.jpg" alt="JS Photo" onclick="goTo('welcome')" style="height:100px; width:auto;" />
      <nav>
        <a onclick="goTo('welcome')">WELCOME</a>
        <a onclick="goTo('portfolio')">PORTFOLIO</a>
        <a onclick="goTo('about')">ABOUT</a>
        <a onclick="goTo('contact')" class="active">CONTACT</a>
      </nav>
    </div>
    <div class="contact-inner">
      <h2>Write to</h2>
      <span>joel.spori gmail com</span>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
    <span class="lightbox-prev" onclick="changePhoto(-1); event.stopPropagation()">&#8249;</span>
    <img id="lightbox-img" src="" alt="" onclick="event.stopPropagation()" />
    <span class="lightbox-next" onclick="changePhoto(1); event.stopPropagation()">&#8250;</span>
  </div>

  <script>
    function goTo(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + page).classList.add('active');
      window.scrollTo(0, 0);
    }

    let currentIndex = 0;
    let photos = [];

    document.querySelectorAll('.portfolio-grid img').forEach((img, i) => {
      img.addEventListener('click', () => openLightbox(i));
    });

    function openLightbox(index) {
      photos = Array.from(document.querySelectorAll('.portfolio-grid img'));
      currentIndex = index;
      document.getElementById('lightbox-img').src = photos[currentIndex].src;
      document.getElementById('lightbox').classList.add('open');
      document.addEventListener('keydown', handleKey);
    }

    function closeLightbox(e) {
      if (e && e.target !== document.getElementById('lightbox') && !e.target.classList.contains('lightbox-close')) return;
      document.getElementById('lightbox').classList.remove('open');
      document.removeEventListener('keydown', handleKey);
    }

    function changePhoto(dir) {
      currentIndex = (currentIndex + dir + photos.length) % photos.length;
      document.getElementById('lightbox-img').src = photos[currentIndex].src;
    }

    function handleKey(e) {
      if (e.key === 'ArrowRight') changePhoto(1);
      if (e.key === 'ArrowLeft') changePhoto(-1);
      if (e.key === 'Escape') {
        document.getElementById('lightbox').classList.remove('open');
        document.removeEventListener('keydown', handleKey);
      }
    }
  </script>
</body>
</html>
